<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1268" font-family="Liberation Sans, sans-serif">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs>
  <rect width="1200" height="1268" fill="url(#bg)"/>
  <path d="M28 78V28H78M1122 28H1172V78M28 1190V1240H78M1122 1240H1172V1190" fill="none" stroke="#8B7AA2" stroke-width="2" opacity=".7"/>
  <text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">RamDog</text>
  <rect x="255" y="50" width="146" height="54" rx="27" fill="#8E65E8"/>
  <text x="281" y="87" font-size="25" fill="#FFFFFF" font-weight="700">v0.14.0</text>
  <text x="56" y="145" font-size="25" fill="#FFD6A0" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text>
  <text x="1020" y="88" font-size="18" fill="#BCB1D2" text-anchor="end">28 SET 2026</text>
  <path d="M56 178H1144" stroke="#76638C" opacity=".5"/>
  <text x="56" y="224" font-size="23" fill="#D8CFE7">Um app, uma linha: Brave, Claude e cia. somados sem contar RAM duas vezes.</text>
  <rect x="56" y="264" width="6" height="28" rx="3" fill="#FFC61A"/>
  <text x="80" y="287" font-size="26" fill="#FFC61A" font-weight="700">NOVIDADES</text>
  <text x="1118" y="287" font-size="20" fill="#BCB1D2" text-anchor="end">2 itens</text>
  <circle cx="86" cy="344" r="6" fill="#FFC61A"/>
  <text x="108" y="352" font-size="27" fill="#F8F5FF" font-weight="700">Agrupar por app nas Categorias</text>
  <text x="108" y="384" font-size="22" fill="#FFE4A3">Cada app numa linha dentro da categoria, com ▶ para ver os PIDs.</text>
  <circle cx="86" cy="438" r="6" fill="#FFC61A"/>
  <text x="108" y="446" font-size="27" fill="#F8F5FF" font-weight="700">Maiores agora por app</text>
  <text x="108" y="478" font-size="22" fill="#FFE4A3">O rodapé soma por app: “brave ×18 1,81 GB”.</text>
  <path d="M56 530H1144" stroke="#76638C" opacity=".35"/>
  <rect x="56" y="562" width="6" height="28" rx="3" fill="#2DD29A"/>
  <text x="80" y="585" font-size="26" fill="#2DD29A" font-weight="700">MELHORIAS</text>
  <text x="1118" y="585" font-size="20" fill="#BCB1D2" text-anchor="end">3 itens</text>
  <circle cx="86" cy="642" r="6" fill="#2DD29A"/>
  <text x="108" y="650" font-size="27" fill="#F8F5FF" font-weight="700">RAM que soma certo no Linux</text>
  <text x="108" y="682" font-size="22" fill="#A7F3D4">PSS por padrão: 18 processos do navegador são 1,8 GB, não 3,6.</text>
  <circle cx="86" cy="736" r="6" fill="#2DD29A"/>
  <text x="108" y="744" font-size="27" fill="#F8F5FF" font-weight="700">Tua configuração atualiza sozinha</text>
  <text x="108" y="776" font-size="22" fill="#A7F3D4">Liga o agrupamento e troca RSS por PSS uma vez só.</text>
  <circle cx="86" cy="830" r="6" fill="#2DD29A"/>
  <text x="108" y="838" font-size="27" fill="#F8F5FF" font-weight="700">Hermes num grupo só</text>
  <text x="108" y="870" font-size="22" fill="#A7F3D4">O gateway em python renomeado entra junto com o resto.</text>
  <path d="M56 922H1144" stroke="#76638C" opacity=".35"/>
  <rect x="56" y="954" width="6" height="28" rx="3" fill="#30BCEF"/>
  <text x="80" y="977" font-size="26" fill="#30BCEF" font-weight="700">CORREÇÕES</text>
  <text x="1118" y="977" font-size="20" fill="#BCB1D2" text-anchor="end">1 item</text>
  <circle cx="86" cy="1034" r="6" fill="#30BCEF"/>
  <text x="108" y="1042" font-size="27" fill="#F8F5FF" font-weight="700">Tabela vazia ao abrir com o mouse em cima</text>
  <text x="108" y="1074" font-size="22" fill="#A9E4F8">A lista agora aparece mesmo com o ponteiro sobre ela.</text>
  <path d="M56 1118H1144" stroke="#76638C" opacity=".5"/>
  <text x="56" y="1166" font-size="25" fill="#FFD6A0" font-weight="700">Menos linhas para caçar, números que batem com a máquina.</text>
  <text x="56" y="1206" font-size="18" fill="#BCB1D2">Notas completas e pacotes: github.com/LucasOl1337/RamDog/releases/tag/v0.14.0</text>
</svg>
