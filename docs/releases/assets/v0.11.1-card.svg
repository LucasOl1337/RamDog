<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1091" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs><rect width="1200" height="1091" fill="url(#bg)"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">RamDog</text><text x="56" y="138" font-size="25" fill="#D8C4EA" font-weight="700">NOTAS DA ATUALIZAÇÃO · v0.11.1</text><text x="970" y="88" font-size="18" fill="#BCB1D2" font-weight="400">21 SET 2026</text><path d="M56 174H1144" stroke="#76638C" opacity=".5"/><rect x="56" y="202" width="6" height="28" rx="3" fill="#FFC61A"/><text x="80" y="225" font-size="26" fill="#FFC61A" font-weight="700">NOVIDADES</text><text x="1040" y="225" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="281" font-size="27" fill="#F8F5FF" font-weight="700">Coluna Quem abriu</text><text x="80" y="315" font-size="23" fill="#BCB1D2" font-weight="400">A cadeia de quem chamou quem no lugar dos argumentos: foot › bash › claude.</text><text x="80" y="370" font-size="27" fill="#F8F5FF" font-weight="700">Botões para zumbi no painel</text><text x="80" y="404" font-size="23" fill="#BCB1D2" font-weight="400">Pedir ao pai para recolher ou finalizar o pai, com nome e PID, sem depender do Shift.</text><path d="M56 436H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="461" width="6" height="28" rx="3" fill="#2DD29A"/><text x="80" y="484" font-size="26" fill="#2DD29A" font-weight="700">MELHORIAS</text><text x="1040" y="484" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="540" font-size="27" fill="#F8F5FF" font-weight="700">Finalizar diz quem está segurando</text><text x="80" y="574" font-size="23" fill="#BCB1D2" font-weight="400">Se o processo vira zumbi, a barra avisa que ele não ocupa memória e quem não recolheu.</text><text x="80" y="629" font-size="27" fill="#F8F5FF" font-weight="700">Comando continua à mão</text><text x="80" y="663" font-size="23" fill="#BCB1D2" font-weight="400">Hover na célula traz cadeia com PIDs e o comando; botão direito no título alterna as colunas.</text><path d="M56 695H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="720" width="6" height="28" rx="3" fill="#30BCEF"/><text x="80" y="743" font-size="26" fill="#30BCEF" font-weight="700">CORREÇÕES</text><text x="1040" y="743" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="799" font-size="27" fill="#F8F5FF" font-weight="700">Pai lido do kernel no clique</text><text x="80" y="833" font-size="23" fill="#BCB1D2" font-weight="400">Zumbi reparentado não é mais atribuído ao pai da amostra antiga.</text><text x="80" y="888" font-size="27" fill="#F8F5FF" font-weight="700">Última coluna acompanha a janela</text><text x="80" y="922" font-size="23" fill="#BCB1D2" font-weight="400">Ao maximizar, a tabela volta a ocupar a largura inteira.</text><path d="M56 954H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1006" font-size="22" fill="#BCB1D2" font-weight="400">Notas completas e limites de validação no GitHub Releases.</text><text x="56" y="1042" font-size="19" fill="#BCB1D2" font-weight="400">github.com/LucasOl1337/RamDog/releases</text><path d="M28 70V28H70 M1130 28H1172V70 M28 1021V1063H70 M1130 1063H1172V1021" stroke="#A593BB" fill="none" opacity=".5"/></svg>