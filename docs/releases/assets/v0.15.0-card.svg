<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1354" font-family="Liberation Sans, sans-serif">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs>
  <rect width="1200" height="1354" fill="url(#bg)"/>
  <path d="M28 78V28H78M1122 28H1172V78M28 1276V1326H78M1122 1326H1172V1276" fill="none" stroke="#8B7AA2" stroke-width="2" opacity=".7"/>
  <text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">RamDog</text>
  <rect x="255" y="50" width="146" height="54" rx="27" fill="#8E65E8"/>
  <text x="281" y="87" font-size="25" fill="#FFFFFF" font-weight="700">v0.15.0</text>
  <text x="56" y="145" font-size="25" fill="#FFD6A0" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text>
  <text x="1020" y="88" font-size="18" fill="#BCB1D2" text-anchor="end">28 SET 2026</text>
  <path d="M56 178H1144" stroke="#76638C" opacity=".5"/>
  <text x="56" y="224" font-size="23" fill="#D8CFE7">Modo Gerenciador: o que tá aberto, quanto pesa e como fechar, numa janela.</text>
  <rect x="56" y="264" width="6" height="28" rx="3" fill="#FFC61A"/>
  <text x="80" y="287" font-size="26" fill="#FFC61A" font-weight="700">NOVIDADES</text>
  <text x="1118" y="287" font-size="20" fill="#BCB1D2" text-anchor="end">3 itens</text>
  <circle cx="86" cy="344" r="6" fill="#FFC61A"/>
  <text x="108" y="352" font-size="27" fill="#F8F5FF" font-weight="700">Modo Gerenciador</text>
  <text x="108" y="384" font-size="22" fill="#FFE4A3">Janela enxuta: apps, segundo plano e sistema, um app por linha.</text>
  <circle cx="86" cy="438" r="6" fill="#FFC61A"/>
  <text x="108" y="446" font-size="27" fill="#F8F5FF" font-weight="700">O agente, não o terminal</text>
  <text x="108" y="478" font-size="22" fill="#FFE4A3">Foot com Claude Code vira “Claude · projeto”, com as sessões.</text>
  <circle cx="86" cy="532" r="6" fill="#FFC61A"/>
  <text x="108" y="540" font-size="27" fill="#F8F5FF" font-weight="700">Fechar educado, forçar com confirmação</text>
  <text x="108" y="572" font-size="22" fill="#FFE4A3">Fecha pela janela; se não sair em 5 s, Forçar… pede confirmação.</text>
  <path d="M56 608H1144" stroke="#76638C" opacity=".35"/>
  <rect x="56" y="640" width="6" height="28" rx="3" fill="#2DD29A"/>
  <text x="80" y="663" font-size="26" fill="#2DD29A" font-weight="700">MELHORIAS</text>
  <text x="1118" y="663" font-size="20" fill="#BCB1D2" text-anchor="end">3 itens</text>
  <circle cx="86" cy="720" r="6" fill="#2DD29A"/>
  <text x="108" y="728" font-size="27" fill="#F8F5FF" font-weight="700">ramdog-launch --gerenciador</text>
  <text x="108" y="760" font-size="22" fill="#A7F3D4">Unidade própria; apertar de novo foca a janela aberta.</text>
  <circle cx="86" cy="814" r="6" fill="#2DD29A"/>
  <text x="108" y="822" font-size="27" fill="#F8F5FF" font-weight="700">Pronto pro Super+Alt+Delete</text>
  <text x="108" y="854" font-size="22" fill="#A7F3D4">Bind e regra de janela do Hyprland no README.</text>
  <circle cx="86" cy="908" r="6" fill="#2DD29A"/>
  <text x="108" y="916" font-size="27" fill="#F8F5FF" font-weight="700">Lista completa ↗</text>
  <text x="108" y="948" font-size="22" fill="#A7F3D4">Abre o RamDog principal com o processo já selecionado.</text>
  <path d="M56 984H1144" stroke="#76638C" opacity=".35"/>
  <rect x="56" y="1016" width="6" height="28" rx="3" fill="#30BCEF"/>
  <text x="80" y="1039" font-size="26" fill="#30BCEF" font-weight="700">CORREÇÕES</text>
  <text x="1118" y="1039" font-size="20" fill="#BCB1D2" text-anchor="end">1 item</text>
  <circle cx="86" cy="1096" r="6" fill="#30BCEF"/>
  <text x="108" y="1104" font-size="27" fill="#F8F5FF" font-weight="700">Nome do AVD sem aspas</text>
  <text x="108" y="1136" font-size="22" fill="#A9E4F8">Emulador aberto por bash -c aparece com o nome limpo.</text>
  <path d="M56 1200H1144" stroke="#76638C" opacity=".5"/>
  <text x="56" y="1248" font-size="25" fill="#FFD6A0" font-weight="700">Super+Alt+Delete e pronto: o RamDog responde na hora.</text>
  <text x="56" y="1288" font-size="18" fill="#BCB1D2">Notas completas e pacotes: github.com/LucasOl1337/RamDog/releases/tag/v0.15.0</text>
</svg>
