<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" font-family="Liberation Sans, sans-serif">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs>
  <rect width="1200" height="1040" fill="url(#bg)"/>
  <path d="M28 78V28H78M1122 28H1172V78M28 962V1012H78M1122 1012H1172V962" fill="none" stroke="#8B7AA2" stroke-width="2" opacity=".7"/>
  <text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">RamDog</text>
  <rect x="255" y="50" width="146" height="54" rx="27" fill="#8E65E8"/>
  <text x="281" y="87" font-size="25" fill="#FFFFFF" font-weight="700">v0.12.0</text>
  <text x="56" y="145" font-size="25" fill="#FFD6A0" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO</text>
  <text x="1020" y="88" font-size="18" fill="#BCB1D2" text-anchor="end">22 SET 2026</text>
  <path d="M56 178H1144" stroke="#76638C" opacity=".5"/>

  <text x="56" y="224" font-size="23" fill="#D8CFE7">Interface completa em inglês, sem perder o português nem os recursos da v0.11.</text>

  <rect x="56" y="264" width="6" height="28" rx="3" fill="#FFC61A"/>
  <text x="80" y="287" font-size="26" fill="#FFC61A" font-weight="700">NOVIDADES</text>
  <text x="1118" y="287" font-size="20" fill="#BCB1D2" text-anchor="end">2 itens</text>
  <circle cx="86" cy="344" r="6" fill="#FFC61A"/>
  <text x="108" y="352" font-size="27" fill="#F8F5FF" font-weight="700">Interface em inglês</text>
  <text x="108" y="384" font-size="22" fill="#FFE4A3">Troque em Preferências; a escolha fica salva e instalações antigas seguem em português.</text>
  <circle cx="86" cy="438" r="6" fill="#FFC61A"/>
  <text x="108" y="446" font-size="27" fill="#F8F5FF" font-weight="700">Documentação bilíngue</text>
  <text x="108" y="478" font-size="22" fill="#FFE4A3">README completo em inglês, com instalação, recursos, plataformas e limites.</text>

  <path d="M56 516H1144" stroke="#76638C" opacity=".35"/>
  <rect x="56" y="548" width="6" height="28" rx="3" fill="#2DD29A"/>
  <text x="80" y="571" font-size="26" fill="#2DD29A" font-weight="700">MELHORIAS</text>
  <text x="1118" y="571" font-size="20" fill="#BCB1D2" text-anchor="end">3 itens</text>
  <circle cx="86" cy="628" r="6" fill="#2DD29A"/>
  <text x="108" y="636" font-size="27" fill="#F8F5FF" font-weight="700">Todos os fluxos seguem o idioma</text>
  <text x="108" y="668" font-size="22" fill="#A7F3D4">Lista, medidores, addons, confirmações, erros e estados usam a preferência escolhida.</text>
  <circle cx="86" cy="722" r="6" fill="#2DD29A"/>
  <text x="108" y="730" font-size="27" fill="#F8F5FF" font-weight="700">v0.11 preservada e traduzida</text>
  <text x="108" y="762" font-size="22" fill="#A7F3D4">Contention, Launched by, accounting e zumbis continuam completos em inglês.</text>
  <circle cx="86" cy="816" r="6" fill="#2DD29A"/>
  <text x="108" y="824" font-size="27" fill="#F8F5FF" font-weight="700">Vitrine real atualizada</text>
  <text x="108" y="856" font-size="22" fill="#A7F3D4">Novas capturas, Limpeza e vídeo narrado mostram o produto em uso.</text>

  <path d="M56 892H1144" stroke="#76638C" opacity=".35"/>
  <text x="56" y="940" font-size="25" fill="#FFD6A0" font-weight="700">RamDog em português ou inglês. O mesmo controle, para mais gente.</text>
  <text x="56" y="978" font-size="18" fill="#BCB1D2">Notas completas e pacotes: github.com/LucasOl1337/RamDog/releases/tag/v0.12.0</text>
