name: Feature request
description: Suggest something RamDog should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out or do on your machine, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How RamDog could help. Mockups or examples from other tools are welcome.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Omarchy / Hyprland
        - Other Linux
        - Windows
        - macOS
