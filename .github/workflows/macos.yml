name: macos

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin
      - name: Pack
        run: |
          tar -C target/aarch64-apple-darwin/release -czf RamDog-macos-aarch64.tar.gz ramdog
          tar -C target/x86_64-apple-darwin/release -czf RamDog-macos-x86_64.tar.gz ramdog
      - uses: actions/upload-artifact@v4
        with:
          name: ramdog-macos
          path: |
            RamDog-macos-aarch64.tar.gz
            RamDog-macos-x86_64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            RamDog-macos-aarch64.tar.gz
            RamDog-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
