[package]
name = "ramdog"
version = "0.1.0"
edition = "2021"
description = "RamDog — gerenciador de RAM ultra leve: origem, árvore, categorias, kill e lock de processos"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_extras = { version = "0.31", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Wdk_Foundation",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Kernel",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
